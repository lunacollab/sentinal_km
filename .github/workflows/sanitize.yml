name: sanitize

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ASan+UBSan rebuild of the daemon parsers/filter/correlator/cglabel and run
# of the whole unit battery under the sanitizer. Also builds the libFuzzer
# harness to prove the target compiles (feeding it happens locally / on
# demand, not in CI, to keep the runtime bounded).
jobs:
  sanitize-daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Pinned to the v4.4.0 tag commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Sanitized unit battery (ASan+UBSan)
        run: make -C daemon sanitize
      - name: libFuzzer harness compiles
        run: make -C daemon fuzz CC=clang
