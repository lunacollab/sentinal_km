# dkms.conf -- let the module follow kernel upgrades.
#
# DKMS runs MAKE from the build root (the dkms source copy). kernel/Makefile
# defaults KDIR to the running kernel, which is what DKMS is building for.
# If your distribution needs an explicit tree, override KDIR via
# MAKE[0]="... KDIR=/path/to/headers".

PACKAGE_NAME="sentinel-km"
PACKAGE_VERSION="0.1.0"
BUILT_MODULE_NAME[0]="sentinel_km"
DEST_MODULE_LOCATION[0]="/kernel/misc"
AUTOINSTALL="yes"
MAKE[0]="make -C kernel"
CLEAN="make -C kernel clean"
