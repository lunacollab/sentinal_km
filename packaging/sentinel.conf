# sample defaults for /etc/sentinel/sentinel.conf
# consumed by daemon/sentinel-daemon -f (see README "Daemon options").
# Keys mirror the CLI flags; booleans accept 1/yes/true/on, 0/no/false/off.

# filter: only events from these pids/uids (repeat lines to add more)
#pid=1234
#uid=1000

# filter: only these event types (repeatable): execve openat connect mmap
# mprotect execveat memfd ptrace clone3 io_uring_enter finit_module
#type=execve

# transport: pick ONE of mmap / ring-read, or set none for netlink
#mmap=/dev/sentinel_ring
#ring-read=/dev/sentinel_ring

#json=yes
#labels=yes
#reconnect=yes
#no-correlate=no
#stats=no
